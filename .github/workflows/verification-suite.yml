# The payroll verification suite, run on every push to main and every pull
# request. This is the CI half of the ADR-0008 evidence gate: a shipped ruleset
# that loses its provenance document or its statutory case fails `cargo test`
# here, and the run with it.
name: verification-suite

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verification-suite-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A rustdoc warning fails the build. Public statutory documentation linking to
  # a private item is exactly the rot this suite exists to catch.
  RUSTDOCFLAGS: -D warnings
  # #[sqlx::test] (issue #25) reads this to find the server, then creates and
  # migrates a fresh throwaway database per test — the migration-applying
  # role above needs superuser so it can freely CREATE ROLE and SET ROLE.
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install the pinned toolchain
        # No arguments: rustup reads rust-toolchain.toml, so the pin lives in
        # exactly one place.
        run: rustup toolchain install

      - name: Confirm the pinned toolchain is the active one
        run: |
          rustup show active-toolchain
          rustc --version
          expected="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          actual="$(rustc --version | cut -d' ' -f2)"
          if [ "$actual" != "$expected" ]; then
            echo "rust-toolchain.toml pins $expected but rustc is $actual" >&2
            exit 1
          fi

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy --all-targets -- -D warnings
        # --locked so CI compiles the dependency versions in the committed
        # Cargo.lock. Without it a fresh resolve can turn this suite green on
        # code the repository does not contain.
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Cache sqlx-cli
        id: cache-sqlx-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/sqlx
          key: sqlx-cli-0.8.6-${{ runner.os }}

      - name: Install sqlx-cli
        if: steps.cache-sqlx-cli.outputs.cache-hit != 'true'
        run: |
          cargo install sqlx-cli --version 0.8.6 --locked \
            --no-default-features --features postgres,rustls

      - name: Run database migrations
        # A smoke test that the migrations this repository ships apply
        # cleanly to a real server — independent of `cargo test`, which
        # migrates its own throwaway databases per #[sqlx::test] rather than
        # this one.
        run: sqlx migrate run --source crates/payroll-app/migrations

      - name: cargo test
        # --no-fail-fast so every failing gate reports, rather than only the
        # first. Test output is never quietened: the assertion naming the
        # shipped rule id that lost its evidence is the point of the run.
        run: cargo test --locked --no-fail-fast

      - name: cargo doc --no-deps
        run: cargo doc --locked --no-deps

      - name: Prove a release build refuses a dirty working tree
        # payroll-app's SaltVersion (issue #24) names the exact commit a
        # historical figure was calculated by. A release binary built from
        # uncommitted changes would record a SHA the code does not match, so
        # crates/payroll-app/build.rs must fail the build. Proved here rather
        # than claimed in a comment.
        #
        # Both dirty files are deliberate. Cargo caches a successful build
        # script run, so the gate is only as good as what build.rs watches:
        # a file under crates/ is the obvious case, and a file outside it is
        # the one a narrower watch would wave through.
        run: |
          set -euo pipefail
          refuses_release_build() {
            # First cache a clean release build. The source edit that follows
            # must still rerun build.rs rather than reuse its clean-tree result.
            git checkout -- .
            cargo build --release --locked -p payroll-app
            echo "$2" >> "$1"
            if cargo build --release --locked -p payroll-app 2>build.log; then
              echo "release build unexpectedly succeeded with $1 dirty" >&2
              cat build.log
              exit 1
            fi
            if ! grep -qi "dirty working tree" build.log; then
              echo "the build failure did not name the dirty working tree as the cause" >&2
              cat build.log
              exit 1
            fi
            rm build.log
            git checkout -- "$1"
          }
          refuses_release_build crates/payroll-app/src/lib.rs \
            "// dirtying a watched crate source to prove the release-build gate"
          refuses_release_build CONTEXT.md \
            "<!-- dirtying a file outside crates/ to prove the same gate -->"

      - name: Prove a debug build tolerates a dirty working tree
        # Ordinary development must not be blocked by the same gate.
        run: |
          set -euo pipefail
          echo "// dirtying the tree to prove the debug build is not blocked" >> crates/payroll-app/src/lib.rs
          cargo build --locked -p payroll-app
          git checkout -- crates/payroll-app/src/lib.rs

      - name: Prove the stamped SaltVersion follows HEAD
        # The other half of "the SHA is not a lie". A clean tree that gains a
        # commit changes no source file, so a build script watching only source
        # would keep stamping the previous commit — a release binary honestly
        # built from a clean tree, naming the wrong code.
        run: |
          set -euo pipefail
          before="$(cargo run --locked -q -p payroll-app --example salt_version)"
          git -c user.name=verification-suite -c user.email=ci@example.invalid \
            commit --allow-empty -q -m "prove SaltVersion tracks HEAD"
          after="$(cargo run --locked -q -p payroll-app --example salt_version)"
          # Reuse the semver half rather than hard-coding it, so a version
          # bump does not silently turn this proof into a false failure.
          expected="${before%%+*}+g$(git rev-parse --short=8 HEAD)"
          git reset --hard -q HEAD~1
          if [ "$after" = "$before" ]; then
            echo "SaltVersion did not change across a commit: still $after" >&2
            exit 1
          fi
          if [ "$after" != "$expected" ]; then
            echo "SaltVersion is $after but HEAD says it should be $expected" >&2
            exit 1
          fi

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install the pinned Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        # --locked's own equivalent: installs exactly what package-lock.json
        # names rather than re-resolving, the same reason cargo test above
        # runs --locked.
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
