[package]
name = "payroll-app"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
payroll = { path = "../payroll" }
chrono = "0.4"
serde_json = "1.0.151"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "chrono",
] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
