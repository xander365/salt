[package]
name = "payroll-app"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
payroll = { path = "../payroll" }
chrono = "0.4"
serde_json = "1.0.151"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "chrono",
] }
uuid = { version = "1", features = ["v7"] }
argon2 = "0.6.0"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

[dev-dependencies]
# Issue #58: drive the real HTTP router and inspect its committed ActionLog
# using this crate's existing SQLx test harness. The reverse dependency is
# test-only; salt-server still has no SQL access (ADR-0018).
salt-server = { path = "../salt-server" }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
